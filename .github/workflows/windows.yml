name: Build Windows App

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/windows/src-tauri
      - run: python scripts/build-web.py
      - run: npm install
        working-directory: apps/windows
      - run: npm run build
        working-directory: apps/windows
      - uses: actions/upload-artifact@v4
        with:
          name: Hermes-Companion-Windows
          path: |
            apps/windows/src-tauri/target/release/bundle/msi/*
            apps/windows/src-tauri/target/release/bundle/nsis/*
          if-no-files-found: error
